<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#5d657c"/></marker></defs>
<rect width="960" height="420" fill="white"/>
<text x="20" y="28" font-size="16" font-weight="700" fill="#070707">How impact.bioconductor.org is built</text>
<rect x="20" y="60" width="200" height="110" rx="10" fill="#f3fae9" stroke="#18a603" stroke-width="2"/><text x="120.0" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">Bioconductor.org</text><text x="120.0" y="104" text-anchor="middle" font-size="11.5" fill="#070707">VIEWS per release (2002→)</text><text x="120.0" y="119" text-anchor="middle" font-size="11.5" fill="#070707">download stats (2009→)</text><text x="120.0" y="134" text-anchor="middle" font-size="11.5" fill="#070707">CITATION files</text>
<rect x="20" y="190" width="200" height="125" rx="10" fill="#ebf4f7" stroke="#0087af" stroke-width="2"/><text x="120.0" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">cdsci-lake (read-only)</text><text x="120.0" y="234" text-anchor="middle" font-size="11.5" fill="#070707">OpenAlex works, refs,</text><text x="120.0" y="249" text-anchor="middle" font-size="11.5" fill="#070707">authorships · NIH iCite</text><text x="120.0" y="264" text-anchor="middle" font-size="11.5" fill="#070707">NIH RePORTER · patents</text>
<rect x="290" y="110" width="200" height="140" rx="10" fill="#fef9eb" stroke="#f1c736" stroke-width="2"/><text x="390.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">Monthly pipeline</text><text x="390.0" y="154" text-anchor="middle" font-size="11.5" fill="#070707">Python + DuckDB</text><text x="390.0" y="169" text-anchor="middle" font-size="11.5" fill="#070707">extract → link → enrich</text><text x="390.0" y="184" text-anchor="middle" font-size="11.5" fill="#070707">one .duckdb file</text>
<rect x="560" y="110" width="160" height="140" rx="10" fill="#f9f9f9" stroke="#5d657c" stroke-width="2"/><text x="640.0" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">Parquet marts</text><text x="640.0" y="154" text-anchor="middle" font-size="11.5" fill="#070707">16 tables</text><text x="640.0" y="169" text-anchor="middle" font-size="11.5" fill="#070707">+ views-only .duckdb</text><text x="640.0" y="184" text-anchor="middle" font-size="11.5" fill="#070707">+ datapackage.json</text>
<rect x="790" y="40" width="150" height="80" rx="10" fill="#ebf4f7" stroke="#0087af" stroke-width="2"/><text x="865.0" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">Dashboard</text><text x="865.0" y="84" text-anchor="middle" font-size="11.5" fill="#070707">DuckDB-WASM in</text><text x="865.0" y="99" text-anchor="middle" font-size="11.5" fill="#070707">the browser</text>
<rect x="790" y="150" width="150" height="80" rx="10" fill="#f3fae9" stroke="#18a603" stroke-width="2"/><text x="865.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">R / Python</text><text x="865.0" y="194" text-anchor="middle" font-size="11.5" fill="#070707">ATTACH &#x27;…duckdb&#x27;</text><text x="865.0" y="209" text-anchor="middle" font-size="11.5" fill="#070707">one line</text>
<rect x="790" y="260" width="150" height="80" rx="10" fill="#fef9eb" stroke="#f1c736" stroke-width="2"/><text x="865.0" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#070707">JSON + badges</text><text x="865.0" y="304" text-anchor="middle" font-size="11.5" fill="#070707">api/v1/package/…</text><text x="865.0" y="319" text-anchor="middle" font-size="11.5" fill="#070707">shields endpoint</text>
<line x1="220" y1="115" x2="290" y2="160" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<line x1="220" y1="252" x2="290" y2="200" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<line x1="490" y1="180" x2="560" y2="180" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<line x1="720" y1="160" x2="790" y2="80" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<line x1="720" y1="180" x2="790" y2="190" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<line x1="720" y1="200" x2="790" y2="300" stroke="#5d657c" stroke-width="2" marker-end="url(#a)" />
<text x="640" y="275" text-anchor="middle" font-size="11" fill="#5d657c">static files on GitHub Pages</text>
<text x="640" y="290" text-anchor="middle" font-size="11" fill="#5d657c">no server</text>
<text x="20" y="345" font-size="12" font-weight="700" fill="#070707">Legend</text>
<rect x="20" y="357" width="16" height="16" rx="3" fill="#f3fae9" stroke="#18a603" stroke-width="2"/><text x="42" y="370" font-size="11" fill="#070707">Bioconductor-native sources and usage</text>
<rect x="255" y="357" width="16" height="16" rx="3" fill="#ebf4f7" stroke="#0087af" stroke-width="2"/><text x="277" y="370" font-size="11" fill="#070707">bibliometric enrichment and publications</text>
<rect x="490" y="357" width="16" height="16" rx="3" fill="#fef9eb" stroke="#f1c736" stroke-width="2"/><text x="512" y="370" font-size="11" fill="#070707">grants, funding, static exports</text>
<rect x="725" y="357" width="16" height="16" rx="3" fill="#f9f9f9" stroke="#5d657c" stroke-width="2"/><text x="747" y="370" font-size="11" fill="#070707">published artifacts</text>
<text x="20" y="408" font-size="10.5" fill="#5d657c">Arrows show the direction of data flow. The pipeline runs monthly on one machine; everything to the right of it is a static file.</text>
</svg>