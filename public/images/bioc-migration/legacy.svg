<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 670" width="1500" height="670" role="img" aria-label="The legacy estate: staging rebuilds the site hourly and pushes it to one EC2 VM, master, whose EBS volume serves everything behind CloudFront.">
