<rect x="960" y="70" width="290" height="110" rx="12" fill="#f2b4411f" stroke="#f2b441" stroke-width="2" stroke-dasharray="7 6"/>
<text x="978" y="102" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e8eef6" font-weight="650" text-anchor="start" xml:space="preserve">master</text>
<text x="978" y="137" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">/packages/stats/</text>
<text x="978" y="160" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">passed through, uncached</text>
