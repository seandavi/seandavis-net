<text x="368" y="331" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">4  404s cached 10 min per build</text>
<text x="368" y="354" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">5  one log record per request</text>
