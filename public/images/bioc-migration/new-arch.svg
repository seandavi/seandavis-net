<text x="1290" y="130" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#e8eef6" font-weight="700" text-anchor="start" xml:space="preserve">No EBS.</text>
<text x="1290" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#e8eef6" font-weight="700" text-anchor="start" xml:space="preserve">No egress fees.</text>
<text x="1290" y="215" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">HTTP/2, brotli</text>
<text x="1290" y="240" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">four hostnames,</text>
<text x="1290" y="265" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">one Worker</text>
</svg>
