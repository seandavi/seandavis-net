<rect x="30" y="70" width="250" height="170" rx="12" fill="#a9b8ca1f" stroke="#a9b8ca" stroke-width="2"/>
<text x="48" y="102" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e8eef6" font-weight="650" text-anchor="start" xml:space="preserve">Clients</text>
<text x="48" y="137" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">browsers</text>
<text x="48" y="160" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">R / BiocManager</text>
<text x="48" y="183" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">mirror operators</text>
<text x="48" y="206" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">crawlers</text>
<rect x="330" y="50" width="560" height="580" rx="16" fill="none" stroke="#4aa8e8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8"/>
<text x="346" y="40" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#4aa8e8" font-weight="700" text-anchor="start" xml:space="preserve">CLOUDFLARE</text>
<rect x="350" y="70" width="520" height="95" rx="12" fill="#4aa8e81f" stroke="#4aa8e8" stroke-width="2"/>
<text x="368" y="102" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e8eef6" font-weight="650" text-anchor="start" xml:space="preserve">WAF + edge cache</text>
<text x="368" y="137" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">one narrow rule for the /talks crawler</text>
<rect x="350" y="195" width="520" height="215" rx="12" fill="#4aa8e81f" stroke="#4aa8e8" stroke-width="2"/>
<text x="368" y="227" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e8eef6" font-weight="650" text-anchor="start" xml:space="preserve">Worker  ·  code in bioc-edge</text>
<text x="368" y="262" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">1  route table: build first, then mirror</text>
<text x="368" y="285" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">2  symlink map: release → 3.23</text>
