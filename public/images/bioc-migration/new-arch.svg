<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" width="1500" height="650" role="img" aria-label="The new edge: clients reach Cloudflare&#x27;s WAF and cache, then the Worker from bioc-edge, which serves the site build first and the R2 mirror second, logs every request, and passes only /packages/stats through to master.">
<title>The new edge: clients reach Cloudflare&#x27;s WAF and cache, then the Worker from bioc-edge, which serves the site build first and the R2 mirror second, logs every request, and passes only /packages/stats through to master.</title>
