<rect x="960" y="230" width="290" height="110" rx="12" fill="#b49cff1f" stroke="#b49cff" stroke-width="2"/>
<text x="978" y="262" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e8eef6" font-weight="650" text-anchor="start" xml:space="preserve">Logpush → GCS</text>
<text x="978" y="297" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">every request, all fields</text>
